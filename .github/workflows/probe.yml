# One-off test: read irsc.ut.ac.ir (plain http) through the Iranian proxy and save the page to branch probe-out (posts nothing)
name: IRSC probe
on: workflow_dispatch
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch IRSC pages through the proxy
        env:
          IR_PROXY: ${{ secrets.IR_PROXY }}   # host:port:user:pass (Reza pasted it)
        run: |
          set +e
          IFS=: read -r H P U W <<< "$IR_PROXY"
          [ -n "$H" ] || { echo "::error::IR_PROXY secret missing"; exit 1; }
          mkdir -p out
          t() { n=$1; shift
            r=$(curl -sS --max-time 40 -x "http://$H:$P" -U "$U:$W" -A "Mozilla/5.0" -o "out/$n.html" \
                -w '%{http_code} %{size_download}B %{time_total}s %{redirect_url}' "$@" 2>&1)
            echo "$n -> $r"; }
          t home   http://irsc.ut.ac.ir/
          t fa     "http://irsc.ut.ac.ir/index.php?lang=fa"
          t en     "http://irsc.ut.ac.ir/index.php?lang=en"
          grep -oiE '(href|src)="[^"]*"' out/*.html | sort -u | head -80
      - name: Save to branch probe-out
        run: |
          cd out && git init -q -b probe-out && git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -A && git commit -qm "IRSC pages $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:probe-out
