# Which proxy gateways pass plain http? Is events_list.xml cheap to poll? (manual run only, posts nothing)
name: IRSC probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test
        env:
          IR_PROXY: ${{ secrets.IR_PROXY }}
        run: |
          set +e
          IFS=: read -r H P U W <<< "$IR_PROXY"
          BASE="${U%-sid-*}"
          sid() { echo "$BASE-sid-$(printf '%08x' $((RANDOM*RANDOM+1)))"; }
          echo "=== gateways (2 rounds)"
          for round in 1 2; do for ip in $(getent ahostsv4 "$H" | awk '{print $1}' | sort -u); do
            c=$(curl -s -m 30 --resolve "$H:$P:$ip" -x "http://$H:$P" -U "$(sid):$W" -A Mozilla/5.0 -o /dev/null -w '%{http_code} %{size_download}B %{time_total}s' http://irsc.ut.ac.ir/events_list.xml 2>/dev/null)
            echo "$ip -> $c"
          done; done
          echo "=== events_list.xml"
          for i in 1 2 3 4 5 6 7 8; do
            c=$(curl -s -m 40 -x "http://$H:$P" -U "$(sid):$W" -A Mozilla/5.0 -H 'Accept-Encoding: gzip' -D /tmp/h -o /tmp/x -w '%{http_code} %{size_download}B %{time_total}s' http://irsc.ut.ac.ir/events_list.xml 2>/dev/null)
            echo "try $i: $c"; [ "${c%% *}" = 200 ] && break
          done
          tr -d '\r' < /tmp/h | grep -viE 'authoriz|cookie'
          file /tmp/x; (zcat /tmp/x 2>/dev/null || cat /tmp/x) > /tmp/x2; wc -c /tmp/x2
          head -c 2500 /tmp/x2; echo; echo ...; tail -c 600 /tmp/x2; echo
          echo "items: $(grep -c '<item' /tmp/x2)"
          LM=$(tr -d '\r' < /tmp/h | grep -i '^last-modified:' | cut -d' ' -f2-); ET=$(tr -d '\r' < /tmp/h | grep -i '^etag:' | cut -d' ' -f2-)
          echo "=== conditional GET (LM='$LM' ET='$ET')"
          for i in 1 2 3 4 5 6; do
            c=$(curl -s -m 40 -x "http://$H:$P" -U "$(sid):$W" -A Mozilla/5.0 ${LM:+-H "If-Modified-Since: $LM"} ${ET:+-H "If-None-Match: $ET"} -o /dev/null -w '%{http_code} %{size_download}B' http://irsc.ut.ac.ir/events_list.xml 2>/dev/null)
            echo "try $i: $c"; case "${c%% *}" in 200|304) break;; esac
          done
