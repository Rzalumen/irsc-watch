# One-off test: can we read irsc.ut.ac.ir through the Iranian proxy? (owner-only, posts nothing)
name: IRSC probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Diagnose the proxy path
        env:
          IR_PROXY: ${{ secrets.IR_PROXY }}   # host:port:user:pass (Reza pasted it)
        run: |
          IFS=: read -r H P U W <<< "$IR_PROXY"
          [ -n "$H" ] || { echo "::error::IR_PROXY secret missing"; exit 1; }
          mkdir -p out
          t() {  # name, extra curl args..., url
            n=$1; shift
            r=$(curl -sS --max-time 30 -x "http://$H:$P" -U "$U:$W" -A "Mozilla/5.0" -o "out/$n.txt" \
                -w '%{http_code} %{size_download}B %{time_total}s' "$@" 2>&1) || true
            echo "$n -> $r"
          }
          t exit_ip        http://ip-api.com/json/?fields=country,isp,query
          head -c 300 out/exit_ip.txt; echo
          t example_https  https://example.com/
          t google_https   https://www.google.com/
          t ut_https       https://ut.ac.ir/
          t irsc_http      http://irsc.ut.ac.ir/
          t irsc_https     https://irsc.ut.ac.ir/
          t irsc_tls12     --tlsv1.2 --tls-max 1.2 https://irsc.ut.ac.ir/
          t irsc_ip_http   -H "Host: irsc.ut.ac.ir" http://$(getent hosts irsc.ut.ac.ir | awk '{print $1}')/
          echo "irsc DNS from runner: $(getent hosts irsc.ut.ac.ir)"
          for i in 1 2 3; do  # new Iranian IP each try (new session id)
            r=$(curl -sS --max-time 30 -x "http://$H:$P" -U "${U%-sid-*}-sid-t$RANDOM$i:$W" -A "Mozilla/5.0" -o /dev/null \
                -w '%{http_code} %{size_download}B %{time_total}s' https://irsc.ut.ac.ir/ 2>&1) || true
            echo "irsc_https new IP $i -> $r"
          done
      - uses: actions/upload-artifact@v4
        with: { name: irsc-diag, path: out, retention-days: 3 }
