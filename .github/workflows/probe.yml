# Dump the IRSC quake list format (manual run only, posts nothing)
name: IRSC probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch
        env:
          IR_PROXY: ${{ secrets.IR_PROXY }}
        run: |
          set +e
          IFS=: read -r H P U W <<< "$IR_PROXY"
          BASE="${U%-sid-*}"
          get() {  # url -> /tmp/b ; retries with a new session until HTTP 200
            for i in 1 2 3 4 5 6 7 8; do
              S="$BASE-sid-$(printf '%08x' $((RANDOM*RANDOM+i)))"
              c=$(curl -s --compressed -m 40 -x "http://$H:$P" -U "$S:$W" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o /tmp/b -w '%{http_code} %{size_download}B %{time_total}s' "$1" 2>/dev/null)
              echo "try $i: $c"; [ "${c%% *}" = 200 ] && return 0
            done; return 1; }
          for u in "http://irsc.ut.ac.ir/" "http://irsc.ut.ac.ir/index.php?lang=fa" "http://irsc.ut.ac.ir/events_list.xml" "http://irsc.ut.ac.ir/currentearthq.php"; do
            echo "=== $u"; get "$u" || continue
            echo "--- links"; grep -oiE '(href|src|action)=["'"'"'][^"'"'"']*' /tmp/b | sort -u | head -40
            echo "--- raw rows"; grep -n -iE '<tr|<td' /tmp/b | head -40 | cut -c1-400
            echo "--- text"; sed -e 's/<[^>]*>/ /g' /tmp/b | tr -s ' \t\r' ' ' | grep -v '^ *$' | head -70 | cut -c1-300
          done
